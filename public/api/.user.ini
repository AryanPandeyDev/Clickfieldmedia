; Upload ceilings for api/ on PHP-FPM / LiteSpeed hosts, which read this file
; instead of php_value lines in .htaccess. The hiring form accepts a CV of up
; to 5 MB; these leave headroom for the rest of the form. apply.php enforces
; the real 5 MB limit itself.
upload_max_filesize = 8M
post_max_size = 10M
